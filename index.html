    <style>
        * { font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; touch-action:manipulation; box-sizing:border-box; }
        body { background:#0f172a; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .phone-frame { width:100%; max-width:375px; height:100vh; max-height:812px; background:#111; padding:12px; box-shadow:0 30px 60px -15px rgba(0,0,0,.7); }
        @media(min-width:390px){ .phone-frame{ height:812px; border-radius:44px; } }
        .phone-screen { width:100%; height:100%; overflow:hidden; position:relative; }
        @media(min-width:390px){ .phone-screen{ border-radius:32px; } }
        .scrollbar-hide::-webkit-scrollbar{display:none}
        .scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
        @keyframes scan-move{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
        .scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22c55e,transparent);box-shadow:0 0 10px #22c55e;animation:scan-move 2s linear infinite}
        .search-highlight{background:rgba(251,191,36,.3);border-radius:2px}
        @keyframes toast-in{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .toast-enter{animation:toast-in .3s ease}
        .blur-sensitive{filter:blur(4px);user-select:none}
        .lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(12px)}
        .pin-input{width:46px;height:46px;text-align:center;font-size:22px;border:2px solid rgba(255,255,255,.25);border-radius:12px;margin:0 3px;background:rgba(255,255,255,.08);color:white;outline:none;-webkit-appearance:none;appearance:none}
        .pin-input:focus{border-color:#3b82f6;background:rgba(59,130,246,.15)}
        .min-touch-target{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
        .card-item{transition:transform .15s ease}
        .card-item:active{transform:scale(.98)}
        input,select,textarea{font-size:16px;-webkit-text-size-adjust:none}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .fade-in{animation:fadeIn .2s ease}
        .category-btn.active{color:white!important}
        .drag-handle{cursor:grab;touch-action:none}
        .drag-handle:active{cursor:grabbing}
        .sortable-ghost{opacity:.35;background:rgba(59,130,246,.12);border-radius:12px}
        .sortable-drag{opacity:.85;box-shadow:0 12px 28px rgba(0,0,0,.25);border-radius:12px}
        /* Glass */
        .glass-mode{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important}
        .glass-card{background:rgba(255,255,255,.1)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 8px 32px rgba(0,0,0,.2)}
        /* Modal */
        .modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-sheet{animation:slideUp .3s ease;width:100%;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0}

// ── SECURITY ──
const SecurityUtils = {
    escapeHtml(s){ if(!s)return''; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; },
    escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); },
    async hashPin(pin){
        try{
            const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));
            return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
        }catch(e){ return btoa(unescape(encodeURIComponent(pin))); }
    },
    async verifyPin(pin,hash){ return(await this.hashPin(pin))===hash; },
    generateSalt(){ return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join(''); }
};

// ── STORAGE ── [F1 FIX: .encoded not .data]
const StorageManager = {
    KEY:'smartvault_v36',
    saveTimeout:null,
    async save(data){
        if(this.saveTimeout)clearTimeout(this.saveTimeout);
        return new Promise(resolve=>{
            this.saveTimeout=setTimeout(async()=>{
                try{ localStorage.setItem(this.KEY,JSON.stringify(await this.encryptData(data))); resolve(true); }
                catch(e){ resolve(false); }
            },600);
        });
    },
    async load(){
        try{ const s=localStorage.getItem(this.KEY); if(!s)return null; return await this.decryptData(JSON.parse(s)); }
        catch(e){ return null; }
    },
    async encryptData(data){ return{ encoded:btoa(unescape(encodeURIComponent(JSON.stringify(data)))), version:1 }; },
    async decryptData(enc){
        try{ return JSON.parse(decodeURIComponent(escape(atob(enc.encoded)))); } // [F1] enc.encoded
        catch(e){ return null; }
    },
    clear(){ localStorage.removeItem(this.KEY); }
};

const navigate=(view,params={},addHist=true)=>{

// ── LOCK ── [F2: sets currentView='lock']
const checkLockStatus=()=>{
    if(state.lockedUntil&&Date.now()<state.lockedUntil)
        return{locked:true,remaining:Math.ceil((state.lockedUntil-Date.now())/1000)};
    return{locked:false};
};
const attemptUnlock=async(pin)=>{
    const ls=checkLockStatus();
    if(ls.locked){showToast(`Δοκιμάστε σε ${ls.remaining}s`,'error');return false;}
    if(await SecurityUtils.verifyPin(pin,state.savedPinHash)){
        state.failedAttempts=0; state.isLocked=false; requestAnimationFrame(render); return true;
    }
    state.failedAttempts++;
    if(state.failedAttempts>=5){ state.lockedUntil=Date.now()+30000; showToast('Κλείδωμα 30 δευτερόλεπτα','error'); }
    else showToast(`Λάθος PIN. Απομένουν ${5-state.failedAttempts}`,'error');
    requestAnimationFrame(render); return false;
};
const lockApp=()=>{
    if(state.savedPinHash){ state.isLocked=true; state.currentView='lock'; requestAnimationFrame(render); }
    else showToast('Ορίστε PIN πρώτα από Ρυθμίσεις → Ασφάλεια','error',3000);
};
let inactivityTimer;
const resetInactivityTimer=()=>{
    clearTimeout(inactivityTimer);
    if(state.savedPinHash&&!state.isLocked) inactivityTimer=setTimeout(lockApp,2*60*1000);
};

// ── EXPORT / IMPORT ──
const downloadFile=(name,content,type)=>{
    const url=URL.createObjectURL(new Blob([content],{type}));
    const a=Object.assign(document.createElement('a'),{href:url,download:name});
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
};

const exportData=()=>{
    const fmt=prompt('Μορφή εξαγωγής:\n1 → JSON (πλήρες αντίγραφο)\n2 → CSV (για Excel)','1');
    if(!fmt||!['1','2'].includes(fmt)){showToast('Ακύρωση','error');return;}
    const ts=new Date().toISOString().split('T')[0];
    let fn=prompt('Όνομα αρχείου:',`smartvault_${ts}`);
    if(!fn?.trim()){showToast('Ακύρωση','error');return;}
    fn=fn.trim().replace(/[\\/:*?"<>|]/g,'_');
    if(fmt==='1'){
        downloadFile(`${fn}.json`,JSON.stringify({version:'3.6',exportedAt:new Date().toISOString(),cards:state.cards},null,2),'application/json');
        showToast('✅ JSON εξήχθη!');
    } else {
        const q=s=>`"${(s||'').replace(/"/g,'""')}"`;
        const rows=['Ονομα;Πεδιο;Τιμη;Κατηγορια;Τυπος'];
        state.cards.forEach(c=>{
            if(!c.fields.length) rows.push(`${q(c.name)};---;---;---;---`);
            else c.fields.forEach(f=>rows.push(`${q(c.name)};${q(f.label)};${q(f.value)};${q(f.category)};${q(f.type)}`));
        });
        downloadFile(`${fn}.csv`,'\uFEFF'+rows.join('\n'),'text/csv;charset=utf-8');
        showToast('✅ CSV εξήχθη!');
    }
};

// [I1] IMPORT JSON/CSV
const importData=()=>{
    const input=document.createElement('input');
    input.type='file'; input.accept='.json,.csv';
    input.onchange=async(e)=>{
        const file=e.target.files[0]; if(!file)return;
        const text=await file.text();
        try{
            if(file.name.endsWith('.json')){
                const data=JSON.parse(text);
                const imported=data.cards||data; // support both {cards:[]} and direct array
                if(!Array.isArray(imported)) throw new Error('Μη έγκυρο JSON format');
                // Merge: add new cards, update existing by name
                let added=0,updated=0;
                imported.forEach(ic=>{
                    const existing=state.cards.find(c=>c.name===ic.name);
                    if(existing){ existing.fields=ic.fields; updated++; }
                    else{ const newId=Math.max(0,...state.cards.map(c=>c.id))+1; state.cards.push({...ic,id:newId}); added++; }
                });
                showToast(`✅ JSON: +${added} νέες, ${updated} ενημερώθηκαν`);
            } else if(file.name.endsWith('.csv')){
                const lines=text.replace(/^\uFEFF/,'').split('\n').filter(l=>l.trim());
                const dataLines=lines.slice(1); // skip header
                let added=0;
                const byName={};
                dataLines.forEach(line=>{
                    const cols=line.split(';').map(c=>c.replace(/^"|"$/g,'').replace(/""/g,'"'));
                    const [name,label,value,category,type]=cols;
                    if(!name||name==='---')return;
                    if(!byName[name]) byName[name]=[];
                    if(label&&label!=='---') byName[name].push({id:genId(),label,value:value||'',category:category||'Άλλο',type:type||'text'});
                });
                Object.entries(byName).forEach(([name,fields])=>{
                    const existing=state.cards.find(c=>c.name===name);
                    if(existing){ existing.fields=[...existing.fields,...fields]; }
                    else{ const newId=Math.max(0,...state.cards.map(c=>c.id))+1; state.cards.push({id:newId,name,fields}); added++; }
                });
                showToast(`✅ CSV εισήχθη! +${added} νέες καρτέλες`);
            }
            saveToStorage(); render();
        } catch(err){ showToast(`❌ Σφάλμα: ${err.message}`,'error',4000); }
    };
    input.click();
};

// ── CLIPBOARD/SHARE ──
const copyToClipboard=async(text)=>{
    try{ await navigator.clipboard.writeText(text); showToast('Αντιγράφηκε!','success',1500); setTimeout(()=>navigator.clipboard.writeText('').catch(()=>{}),30000); }
    catch{
        const ta=Object.assign(document.createElement('textarea'),{value:text});
        Object.assign(ta.style,{position:'fixed',opacity:'0'}); document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); showToast('Αντιγράφηκε!','success',1500); } catch{ showToast('Αποτυχία','error'); }
        document.body.removeChild(ta);
    }
};
const shareCard=async()=>{
    const card=state.cards.find(c=>c.id===state.selectedCard); if(!card)return;
    const text=`📋 ${card.name}\n\n`+card.fields.map(f=>`${f.label}: ${f.value}`).join('\n');
    if(navigator.share){ try{ await navigator.share({title:`Smart Vault: ${card.name}`,text}); return; } catch(e){ if(e.name==='AbortError')return; } }
    await copyToClipboard(text);
};

// ── EVENTS ──
const setupEventDelegation=()=>{
    const app=document.getElementById('app'); if(!app)return;
    app.addEventListener('click',e=>{
        const t=e.target.closest('[data-action]'); if(!t)return;
        e.preventDefault(); e.stopPropagation();
        const a=t.dataset.action,p=t.dataset;
        switch(a){
            case 'navigate':            navigate(p.view,{cardId:p.cardId?parseInt(p.cardId):null}); break;
            case 'back':                goBack(); break;
            case 'view-card':           state.activeCategory='Όλα'; navigate('card',{cardId:parseInt(p.cardId)}); break;
            case 'edit-card':           editCard(parseInt(p.cardId)); break;
            case 'delete-card':         deleteCard(parseInt(p.cardId)); break;
            case 'toggle-reveal':       toggleReveal(p.fieldId); break;
            case 'change-theme':        changeTheme(p.themeId); break;
            case 'remove-field':        removeField(p.fieldId); break;
            case 'toggle-biometric':    toggleBiometric(); break;
            case 'lock-app':            lockApp(); break;
            case 'unlock-submit':       handleUnlockSubmit(); break;
            case 'scan-field':          openScan(p.fieldId); break;
            case 'camera-field':        openCamera(p.fieldId); break;
            case 'simulate-scan':       simulateScanResult(p.type); break;
            case 'close-scan':          closeScan(); break;
            case 'toggle-flash':        showToast('🔦 Flash toggled'); break;
            case 'copy-field':          copyToClipboard(p.value); break;
            case 'share-card':          shareCard(); break;
            case 'export-data':         exportData(); break;
            case 'import-data':         importData(); break;
            case 'show-about':          state.showAboutModal=true; requestAnimationFrame(render); break;
            case 'close-about':         state.showAboutModal=false; requestAnimationFrame(render); break;
            case 'save-pin':            handleSavePin(); break;
            case 'remove-pin':          removePin(); break;
            case 'save-card':           saveCard(); break;
            case 'add-extra-field':     addExtraField(); break;
            case 'start-new-card':      startEdit(); break;
            case 'clear-search':        state.searchQuery=''; requestAnimationFrame(render); break;
            case 'filter-category':     state.activeCategory=p.category; requestAnimationFrame(render); break;
            case 'capture-photo':       state.cameraPreview=true; render(); break;
            case 'retake-photo':        state.cameraPreview=false; render(); break;
            case 'toggle-field-select': toggleFieldSelect(p.fieldId); break;
            case 'select-all-fields':   selectAllFields(); break;
            case 'clear-selection':     state.selectedFields.clear(); requestAnimationFrame(render); break;
            case 'share-selected':      shareSelected(); break;
            case 'copy-selected':       copySelected(); break;
        }
    });
    app.addEventListener('input',e=>{
        const a=e.target.dataset.action;
        if(a==='search-input'){ state.searchQuery=e.target.value; render(); }
        if(a==='pin-input')    handlePinInputSecurity(e.target);
        if(a==='unlock-pin')   handlePinInputLock(e.target); // [F3]
        if(a==='card-name-input'&&state.editingCard) state.editingCard.name=e.target.value;
        if(a==='field-value-input')    updateFieldValue(e.target.dataset.fieldId,e.target.value);
        if(a==='field-label-input')    updateFieldLabel(e.target.dataset.fieldId,e.target.value);
        if(a==='field-category-select')updateFieldCategory(e.target.dataset.fieldId,e.target.value);
    });
    // SortableJS [F5 fix]
    setTimeout(()=>{
        const el=document.getElementById('extra-fields-container');
        if(el&&!sortableInstance){
            sortableInstance=new Sortable(el,{
                handle:'.drag-handle', animation:150,
                ghostClass:'sortable-ghost', dragClass:'sortable-drag',
                onEnd:(evt)=>{
                    if(!state.editingCard)return;
                    const isStatic=f=>['ΑΔΤ','ΑΦΜ','ΑΜΚΑ','ΑΜΑ'].includes(f.label)||f.type==='phone';
                    const statics=state.editingCard.fields.filter(isStatic);
                    const extras=state.editingCard.fields.filter(f=>!isStatic(f));
                    const order=Array.from(evt.to.children).map(c=>c.dataset.fieldId);
                    state.editingCard.fields=[...statics,...order.map(id=>extras.find(f=>f.id===id)).filter(Boolean)];
                }
            });
        }
    },150);
};

// ── RENDER ENGINE ──
const render=()=>{
    if(renderPending)return; renderPending=true;
    requestAnimationFrame(()=>{
        const app=document.getElementById('app');
        const screen=document.getElementById('screen');
        if(!app||!screen){renderPending=false;return;}
        const t=T();
        screen.classList.remove('glass-mode');
        if(t.glass) screen.classList.add('glass-mode');
        else screen.style.background=t.bg;
        resetInactivityTimer();
        const views={home:renderHome,settings:renderSettings,search:renderSearch,
            security:renderSecurity,themes:renderThemes,card:renderCardDetail,
            edit:renderEdit,scan:renderScan,camera:renderCamera,lock:renderLockScreen};
        app.innerHTML=(views[state.currentView]||renderHome)()
            +(state.showAboutModal?renderAboutModal():'')
            +renderToast();
        setupEventDelegation();
        saveToStorage();
        renderPending=false;
    });
};

const renderCardDetail=()=>{
    const t=T(), cb=CB(t), brd=BORD(t);
    const card=state.cards.find(c=>c.id===state.selectedCard);
    if(!card){navigate('home');return'';}
    const cats=['Όλα',...[...new Set(card.fields.map(f=>f.category))]];
    const fields=state.activeCategory==='Όλα'?card.fields:card.fields.filter(f=>f.category===state.activeCategory);
    const nSel=state.selectedFields.size, hasSel=nSel>0;
    const chkOn=`<svg class="w-5 h-5" viewBox="0 0 20 20"><rect width="20" height="20" rx="5" fill="${t.primary}"/><path d="M5 10l3.5 3.5L15 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
    const chkOff=`<svg class="w-5 h-5" viewBox="0 0 20 20" fill="none"><rect x="1" y="1" width="18" height="18" rx="4" stroke="${isDark(t)?'rgba(255,255,255,0.3)':'#cbd5e1'}" stroke-width="1.5"/></svg>`;
    return`<div class="flex flex-col h-full fade-in" style="background:${t.glass?'transparent':t.bg};color:${t.text}">
    <div class="flex items-center justify-between p-4 border-b" style="border-color:${brd}">
        <button data-action="back" class="p-2 rounded-xl hover:opacity-70 min-touch-target">${ICO.back}</button>
        <div class="text-center"><h1 class="font-bold text-base">${SecurityUtils.escapeHtml(card.name)}</h1>${hasSel?`<p class="text-xs font-medium" style="color:${t.primary}">${nSel} επιλεγμένα</p>`:''}</div>
        <button data-action="lock-app" class="p-2 rounded-xl hover:opacity-70 min-touch-target" style="color:${t.primary}">${ICO.lock}</button>
    </div>
    <div class="flex gap-2 px-4 py-3 overflow-x-auto scrollbar-hide border-b" style="border-color:${brd}">
        ${cats.map(cat=>`<button data-action="filter-category" data-category="${cat}"
            class="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap category-btn ${state.activeCategory===cat?'active':''}"
            style="${state.activeCategory===cat?`background:${t.primary};color:white;border:none`:`background:${cb};border:1px solid ${brd};color:${CT(t)}`}">
            ${CAT_ICONS[cat]?CAT_ICONS[cat]+' ':''}${SecurityUtils.escapeHtml(cat)}</button>`).join('')}
    </div>
    ${hasSel?`<div class="flex items-center justify-between px-4 py-2 border-b text-xs font-bold" style="border-color:${brd};background:${t.primary}18">
        <button data-action="select-all-fields" style="color:${t.primary}">${nSel===fields.length?'Αποεπιλογή όλων':'Επιλογή όλων'}</button>
        <button data-action="clear-selection" class="opacity-50">Ακύρωση</button>
    </div>`:''}
    <div class="flex-1 overflow-y-auto scrollbar-hide px-4 pb-28">
        ${fields.length===0?`<p class="text-center opacity-40 py-10 text-sm">Δεν υπάρχουν πεδία</p>`:''}
        ${fields.map(field=>{
            const isBanking=field.category==='Τράπεζα'||field.type==='iban';
            const isRev=state.revealedFields.has(field.id);
            const isSel=state.selectedFields.has(field.id);
            let disp=field.value;

const handlePinInputSecurity=target=>{ target.value=target.value.replace(/\D/,'').slice(0,1); const i=parseInt(target.dataset.index); const inputs=document.querySelectorAll('[data-action="pin-input"]'); if(target.value&&i<5)inputs[i+1]?.focus(); };
const handlePinInputLock=target=>{ // [F3]
    target.value=target.value.replace(/\D/,'').slice(0,1);
    const i=parseInt(target.dataset.index);
    const inputs=Array.from(document.querySelectorAll('[data-action="unlock-pin"]'));
    if(target.value&&i<5)inputs[i+1]?.focus();
    if(inputs.map(x=>x.value).join('').length===6)handleUnlockSubmit();
};
const handleUnlockSubmit=async()=>{
    const inputs=Array.from(document.querySelectorAll('[data-action="unlock-pin"]'));
    const pin=inputs.map(i=>i.value).join('');
    if(pin.length!==6)return;
    const ok=await attemptUnlock(pin);
    if(!ok){inputs.forEach(i=>i.value='');inputs[0]?.focus();}
};
const handleSavePin=async()=>{
    const inputs=Array.from(document.querySelectorAll('[data-action="pin-input"]'));
    const pin=inputs.map(i=>i.value).join('');
    const msgEl=document.getElementById('pinMsg'); if(!msgEl)return;
    if(pin.length!==6||!/^\d{6}$/.test(pin)){
        msgEl.textContent='⚠️ Το PIN πρέπει να είναι 6 ψηφία.';
        msgEl.className='text-sm text-center mb-3 font-medium text-red-500'; msgEl.classList.remove('hidden'); return;
    }
    state.savedPinHash=await SecurityUtils.hashPin(pin); state.pinSalt=SecurityUtils.generateSalt();
    msgEl.textContent='✅ PIN ορίστηκε!'; msgEl.className='text-sm text-center mb-3 font-medium text-emerald-500'; msgEl.classList.remove('hidden');
    inputs.forEach(i=>i.value='');
    setTimeout(()=>{msgEl.classList.add('hidden');saveToStorage();},2000);
};
const removePin=()=>{ if(!confirm('Αφαίρεση PIN;'))return; state.savedPinHash=null;state.pinSalt=null; showToast('PIN αφαιρέθηκε'); setTimeout(()=>{render();saveToStorage();},400); };
const toggleBiometric=()=>{state.biometricEnabled=!state.biometricEnabled;render();saveToStorage();};
const changeTheme=id=>{state.themeId=id;render();saveToStorage();};
const toggleReveal=id=>{state.revealedFields.has(id)?state.revealedFields.delete(id):state.revealedFields.add(id);render();};
const updateFieldValue=(id,val)=>{const f=state.editingCard?.fields.find(x=>x.id===id);if(f)f.value=val.replace(/\s/g,'');};
const updateFieldLabel=(id,val)=>{const f=state.editingCard?.fields.find(x=>x.id===id);if(f)f.label=val;};
const updateFieldCategory=(id,val)=>{const f=state.editingCard?.fields.find(x=>x.id===id);if(f)f.category=val;};
const removeField=id=>{if(!state.editingCard)return;state.editingCard.fields=state.editingCard.fields.filter(f=>f.id!==id);if(sortableInstance){sortableInstance.destroy();sortableInstance=null;}render();showToast('Πεδίο αφαιρέθηκε');};
const addExtraField=()=>{
    if(!state.editingCard)return;
    state.editingCard.fields.push({id:genId(),label:'Νέο Πεδίο',value:'',category:'Άλλο',type:'text'});
    if(sortableInstance){sortableInstance.destroy();sortableInstance=null;}
    render(); showToast('Νέο πεδίο προστέθηκε');
    setTimeout(()=>{const inp=document.querySelectorAll('[data-action="field-label-input"]');const last=inp[inp.length-1];if(last){last.focus();last.select();}},120);
};
const startEdit=()=>{
    const newId=Math.max(0,...state.cards.map(c=>c.id))+1;
    state.editingCard={id:newId,name:'',fields:[
        {id:genId(),label:'ΑΔΤ',  value:'',category:'Προσωπικά',type:'text'},
        {id:genId(),label:'ΑΦΜ',  value:'',category:'Προσωπικά',type:'text'},
        {id:genId(),label:'ΑΜΚΑ', value:'',category:'Υγεία',    type:'text'},
        {id:genId(),label:'ΑΜΑ',  value:'',category:'Υγεία',    type:'text'},
        {id:genId(),label:'Κινητό Προσωπικό',value:'',category:'Προσωπικά',type:'phone'},
        {id:genId(),label:'Σταθερό',value:'',category:'Προσωπικά',type:'phone'},
    ]};
    navigate('edit');
};
const editCard=id=>{const c=state.cards.find(x=>x.id===id);if(c){state.editingCard=JSON.parse(JSON.stringify(c));navigate('edit');}};
const saveCard=()=>{
    if(!state.editingCard)return;
    if(!state.editingCard.name.trim()){showToast('⚠️ Εισάγετε όνομα','error');return;}
    const idx=state.cards.findIndex(c=>c.id===state.editingCard.id);
    if(idx>=0)state.cards[idx]=state.editingCard;else state.cards.push(state.editingCard);
    state.editingCard=null;
    if(sortableInstance){sortableInstance.destroy();sortableInstance=null;}
    showToast('✅ Καρτέλα αποθηκεύτηκε!'); navigate('home');
};
const deleteCard=id=>{
    if(!confirm('Να διαγραφεί;'))return;
    state.cards=state.cards.filter(c=>c.id!==id);
    if(state.selectedCard===id)state.selectedCard=null;
    showToast('Καρτέλα διαγράφηκε'); navigate('home');
};
const openScan=id=>{state.scanTargetField=id;navigate('scan');};
const openCamera=id=>{state.scanTargetField=id;state.cameraPreview=false;navigate('camera');};
const closeScan=()=>{if(sortableInstance){sortableInstance.destroy();sortableInstance=null;}navigate('edit');};
const simulateScanResult=type=>{
    const res={iban:'GR1601101250000000099900888',card:'5520123456789012',doc:'Δείγμα κειμένου OCR'};
    if(state.editingCard&&state.scanTargetField){const f=state.editingCard.fields.find(x=>x.id===state.scanTargetField);if(f){f.value=res[type];if(type==='iban')f.type='iban';showToast(`✅ ${type.toUpperCase()} αναγνώστηκε!`);}}
    closeScan();
};
const toggleFieldSelect=id=>{state.selectedFields.has(id)?state.selectedFields.delete(id):state.selectedFields.add(id);requestAnimationFrame(render);};
const selectAllFields=()=>{
    const card=state.cards.find(c=>c.id===state.selectedCard);if(!card)return;
    const fields=state.activeCategory==='Όλα'?card.fields:card.fields.filter(f=>f.category===state.activeCategory);
    if(fields.every(f=>state.selectedFields.has(f.id)))fields.forEach(f=>state.selectedFields.delete(f.id));
    else fields.forEach(f=>state.selectedFields.add(f.id));
    requestAnimationFrame(render);
};
const getSelText=()=>{
    const card=state.cards.find(c=>c.id===state.selectedCard);if(!card)return'';
    return card.fields.filter(f=>state.selectedFields.has(f.id)).map(f=>`${f.label}: ${f.value}`).join('\n');
};
const shareSelected=async()=>{
    const card=state.cards.find(c=>c.id===state.selectedCard);
    const text=`📋 ${card?.name||''}\n\n`+getSelText();
    if(navigator.share){try{await navigator.share({title:card?.name||'Smart Vault',text});return;}catch(e){if(e.name==='AbortError')return;}}
    await copyToClipboard(text);
};
const copySelected=async()=>{await copyToClipboard(getSelText());state.selectedFields.clear();requestAnimationFrame(render);};

// ── INIT ──
const init=async()=>{
    await loadFromStorage();
    if(state.savedPinHash){state.isLocked=true;state.currentView='lock';}
    requestAnimationFrame(render);
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.savedPinHash&&!state.isLocked)lockApp();});
};
init();
</script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(r => console.log('SW registered'))
                    .catch(e => console.log('SW error:', e));
            });
        }
    </script>
